[package]
name = "lmdv-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
pulldown-cmark = "0.13.6"
ratatui = { version = "0.30.2", features = ["crossterm"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
